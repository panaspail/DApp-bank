<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank DApp Assignment</title>
    <!-- นำเข้า Ethers.js library v5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 500px; }
        button { margin: 5px 0; padding: 8px 12px; cursor: pointer; }
        input { padding: 8px; margin-right: 5px; width: 60%; }
        .info { background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- แสดงรหัสนักศึกษา และ ชื่อ-สกุล บนหน้าเว็บ -->
        <div class="info">
            <h3>ข้อมูลผู้จัดทำ</h3>
            <p><strong>รหัสนักศึกษา:</strong> 66077392</p>
            <p><strong>ชื่อ-สกุล:</strong> นายพนัส เหล่าตระกูลงาม</p>
        </div>

        <h2>Bank DApp</h2>

        <!-- ปุ่มเชื่อมต่อ MetaMask -->
        <button id="connectBtn" onclick="connectMetaMask()">Connect MetaMask</button>
        <p><strong>Connected Account:</strong> <span id="account">Not connected</span></p>
        <p><strong>Balance:</strong> <span id="balance">0</span> ETH</p>

        <hr>

        <!-- ฟังก์ชัน Deposit -->
        <div>
            <h3>Deposit ETH</h3>
            <input type="number" id="depositAmount" step="0.01" placeholder="Amount in ETH">
            <button onclick="deposit()">Deposit</button>
        </div>

        <!-- ฟังก์ชัน Withdraw -->
        <div>
            <h3>Withdraw ETH</h3>
            <input type="number" id="withdrawAmount" step="0.01" placeholder="Amount in ETH">
            <button onclick="withdraw()">Withdraw</button>
        </div>

        <!-- ฟังก์ชัน Check Balance -->
        <div style="margin-top: 15px;">
            <button onclick="checkBalance()">Check Balance</button>
        </div>

        <div>
            <h3>Check Balance (โดยไม่ต้องต่อ MetaMask)</h3>
            <input type="text" id="checkAddressInput" placeholder="กรอก Wallet Address (0x...)">
            <button onclick="checkBalanceByAddress()">Check Balance</button>
        </div>
    </div>

     <script>
        const contractAddress = "0x08f52fad7bC667b97d2145A4282DFCF36ce748A7";
        const contractABI = [
            "function deposit() public payable",
            "function withdraw(uint amount) public",
            "function checkBlance() public view returns (uint balance)",
            "event Deposit(address indexed owner, uint amount)",
            "event Withdraw(address indexed owner, uint amount)"
        ];

        // 🔑 ใส่ Infura API Key ของคุณที่นี่ (เช่น Sepolia, Goerli หรือ Mainnet)
        const INFURA_API_KEY = "YOUR_INFURA_API_KEY";
        const INFURA_RPC_URL = `https://sepolia.infura.io/v3/${INFURA_API_KEY}`;

        let readOnlyProvider;
        let web3Provider;
        let signer;
        let bankContractRead;
        let bankContractWrite;
        let userAccount;

        // เริ่มต้นสร้าง Provider จาก Infura ทันทีที่โหลดหน้าเว็บ
        window.addEventListener('load', () => {
            initInfura();
        });

        function initInfura() {
            // สร้าง Provider สำหรับอ่านข้อมูลผ่าน Infura
            readOnlyProvider = new ethers.providers.JsonRpcProvider(INFURA_RPC_URL);
            bankContractRead = new ethers.Contract(contractAddress, contractABI, readOnlyProvider);
            console.log("Connected to Infura Provider");
        }

        // 1. เชื่อมต่อ MetaMask[cite: 1]
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = web3Provider.getSigner();
                    
                    userAccount = await signer.getAddress();
                    document.getElementById('account').innerText = userAccount;
                    document.getElementById('connectBtn').innerText = "Connected";

                    // สร้าง Contract Instance สำหรับส่ง Transaction (Write)[cite: 1]
                    bankContractWrite = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    checkBalance();
                } catch (error) {
                    console.error("User denied account access", error);
                }
            } else {
                alert("กรุณาติดตั้ง MetaMask Extension บนเบราว์เซอร์");
            }
        }

        // 2. Check Balance (ใช้ Infura อ่านค่าหากยังไม่ต่อ MetaMask)[cite: 1]
        async function checkBalance() {
            if (!userAccount) {
                return alert("กรุณาเชื่อมต่อ MetaMask เพื่อระบุ Address ที่ต้องการเช็คยอดเงิน");
            }
            try {
                // เรียกใช้ Read-only contract ที่สร้างจาก Infura Provider
                const balanceWei = await bankContractRead.checkBlance({ from: userAccount });
                const balanceEth = ethers.utils.formatEther(balanceWei);
                document.getElementById('balance').innerText = balanceEth;
            } catch (error) {
                console.error(error);
                alert("ไม่สามารถเช็คยอดเงินได้: " + error.message);
            }
        }

        // 3. Deposit ETH (ใช้ Signer จาก MetaMask)[cite: 1]
        async function deposit() {
            if (!bankContractWrite) return alert("กรุณาเชื่อมต่อ MetaMask ก่อน");
            const amount = document.getElementById('depositAmount').value;
            if (!amount || amount <= 0) return alert("กรุณาระบุจำนวนเงิน");

            try {
                const tx = await bankContractWrite.deposit({
                    value: ethers.utils.parseEther(amount)
                });
                await tx.wait();
                alert("Deposit สำเร็จ!");
                checkBalance();
            } catch (error) {
                console.error(error);
                alert("Deposit ล้มเหลว: " + error.message);
            }
        }

        // 4. Withdraw ETH (ใช้ Signer จาก MetaMask)[cite: 1]
        async function withdraw() {
            if (!bankContractWrite) return alert("กรุณาเชื่อมต่อ MetaMask ก่อน");
            const amount = document.getElementById('withdrawAmount').value;
            if (!amount || amount <= 0) return alert("กรุณาระบุจำนวนเงิน");

            try {
                const amountInWei = ethers.utils.parseEther(amount);
                const tx = await bankContractWrite.withdraw(amountInWei);
                await tx.wait();
                alert("Withdraw สำเร็จ!");
                checkBalance();
            } catch (error) {
                console.error(error);
                alert("Withdraw ล้มเหลว: " + error.message);
            }
        }

        async function checkBalanceByAddress() {
            const inputAddr = document.getElementById('checkAddressInput').value.trim();
            
            // ถ้าไม่ได้กรอก Address และยังไม่ได้ต่อ MetaMask ให้แจ้งเตือน
            const targetAddress = inputAddr || userAccount;
            
            if (!targetAddress) {
                return alert("กรุณากรอก Wallet Address ที่ต้องการเช็ค หรือกด Connect MetaMask ก่อนครับ");
            }

            try {
                // ส่งค่า { from: targetAddress } เพื่อให้ Smart Contract รู้ว่ากำลังเช็คยอดของ Address ไหน
                const balanceWei = await bankContractRead.checkBlance({ from: targetAddress });
                const balanceEth = ethers.utils.formatEther(balanceWei);
                
                document.getElementById('balance').innerText = balanceEth;
                alert(`ยอดเงินของ ${targetAddress.substring(0,6)}... คือ ${balanceEth} ETH`);
            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการเช็คยอดเงิน: " + error.message);
            }
        }
    </script>
</body>
</html>
